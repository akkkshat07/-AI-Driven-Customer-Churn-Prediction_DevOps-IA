name: AI Churn Prediction - DevOps Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # Job 1: Build and Test
  build-and-test:
    name: Build & Test Application
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Verify project structure
      run: |
        echo "=== Checking project structure ==="
        ls -la
        ls -la data/
        ls -la src/
        
    - name: Train model
      run: |
        echo "=== Training CatBoost model ==="
        cd src
        python train_model.py
        cd ..
        
    - name: Verify model creation
      run: |
        echo "=== Verifying model file ==="
        ls -la model/
        if [ ! -f "model/cat_model.cbm" ]; then
          echo "ERROR: Model file not created!"
          exit 1
        fi
        echo "✓ Model file created successfully"
        
    - name: Test imports
      run: |
        echo "=== Testing Python imports ==="
        python -c "import pandas; import catboost; import fastapi; import streamlit; print('✓ All imports successful')"

  # Job 2: Docker Build and Push
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
      
    - name: Build Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./Dockerfile
        push: false
        tags: telco-churn-api:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
        
    - name: Push to Docker Hub (Optional)
      run: |
        echo "Docker image built successfully but Docker Hub push is optional"
        echo "To enable, configure DOCKER_USERNAME and DOCKER_PASSWORD secrets in GitHub"
      continue-on-error: true

  # Job 3: Code Quality Check
  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install linting tools
      run: |
        pip install flake8 pylint
        
    - name: Run flake8
      run: |
        echo "=== Running flake8 linter ==="
        flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics || true
        
    - name: Check Python syntax
      run: |
        echo "=== Checking Python syntax ==="
        python -m py_compile src/train_model.py
        python -m py_compile src/fast_api.py
        python -m py_compile src/streamlit-app.py
        python -m py_compile src/predict.py

  # Job 4: Deployment Notification
  deploy-ready:
    name: Deployment Ready
    runs-on: ubuntu-latest
    needs: [build-and-test, docker, code-quality]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    
    steps:
    - name: Deployment summary
      run: |
        echo "================================"
        echo "🚀 AI CHURN PREDICTION PIPELINE"
        echo "================================"
        echo "✓ Build & Test: SUCCESS"
        echo "✓ Docker Image: BUILT"
        echo "✓ Code Quality: CHECKED"
        echo ""
        echo "📦 Ready for deployment to:"
        echo "   - Render"
        echo "   - Railway"
        echo "   - AWS ECS"
        echo "   - Azure App Service"
        echo ""
        echo "🔗 Docker image: telco-churn-api:latest"
        echo "🔗 API Port: 8000"
        echo "================================"
        echo "Developed by Akshat | IA-2 Project"
        echo "================================"
